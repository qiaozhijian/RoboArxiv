name: Update

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Runs once per day at 00:30 UTC (slightly offset to reduce thundering herd)
    - cron: "30 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Run RoboArxiv builder
        run: uv run scripts/build.py
        # The script uses PEP 723 inline dependencies.
        # uv automatically installs arxiv + tomli + httpx on first run.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target
          force_orphan: true
          cname: ""   # set a custom domain here if you ever use one
